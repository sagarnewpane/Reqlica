[project]
name = "reqlica"
version = "0.1.0"
description = "Local stateful mock APIs with reviewed Python drafts, SQLite and MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1,<1",
    "jsonschema>=4.26,<5",
    "mcp>=1.27,<2",
    "openai>=3.33.0",
    "requests>=2.34.2",
    "pyyaml>=6.0.3,<7",
    "pyflakes>=3.4,<4",
]

[project.scripts]
reqlica = "reqlica.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/reqlica"]

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"
